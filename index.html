<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f4">
  <title>A little bouquet</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <span class="eyebrow">a little bunch of happy</span>
      <h1>A bouquet for you <span>♡</span></h1>
      <p>Tap a tulip to unfold a little message.</p>
    </header>

    <section class="garden" aria-label="Interactive bouquet of ten tulips and baby's breath">
      <div class="bouquet-card">
        <div class="sparkle sparkle-one">✳</div><div class="sparkle sparkle-two">✧</div>
        <div class="bouquet-hint">10 tulips <span>·</span> baby's breath</div>
        <svg id="bouquet" viewBox="0 0 420 510" role="group" aria-label="Bouquet. Choose a tulip to open it."></svg>
      </div>
    </section>

    <footer>Made of soft petals &amp; happy thoughts <span>✿</span></footer>
  </main>

</body>
</html>
